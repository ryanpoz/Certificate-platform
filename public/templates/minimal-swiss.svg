<rect x="939.0" y="670.0" width="24.0" height="24.0" rx="2" fill="none" stroke="#111111" stroke-width="4.0"/>
<rect x="946.2" y="677.2" width="9.6" height="9.6" fill="#111111"/>
<text x="995.0" y="680.0" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16.0" font-weight="700" fill="#7A7A7A" text-anchor="middle" letter-spacing="1">QR</text>
