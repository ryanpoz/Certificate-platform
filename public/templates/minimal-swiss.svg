<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<title>Minimal Swiss</title>
<defs>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Great+Vibes&amp;display=swap');</style>
</defs>
<g id="deco_background">
<rect x="0" y="0" width="1123" height="794" fill="#FAFAF7"/>
</g>
<g id="deco_border">
<rect x="40" y="40" width="1043" height="714" fill="none" stroke="#111111" stroke-width="1"/>
</g>
<g id="deco_rules">
<line x1="96" y1="168" x2="1027" y2="168" stroke="#111111" stroke-width="1"/>
<line x1="96" y1="560" x2="1027" y2="560" stroke="#111111" stroke-width="1"/>
</g>
<g id="deco_1">
<rect x="96" y="226" width="14" height="14" fill="#E63946"/>
</g>
<g id="logo">
<rect x="96" y="86" width="120" height="44" rx="0" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="156.0" y="113.0" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#7A7A7A" text-anchor="middle" letter-spacing="3">LOGO</text>
</g>
<text id="org_name" x="1027" y="115" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#111111" text-anchor="end" letter-spacing="0.5">Acme Academy</text>
<text id="certificate_title" x="124" y="239" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="3">Certificate of Completion</text>
<text id="recipient_name" x="90" y="368" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="100" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="-4">{Recipient name}</text>
<text id="description" x="96" y="432" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#4A4A4A" text-anchor="start">has successfully completed Advanced Product Training</text>
<text id="signature_1" x="96" y="640" font-family="'Great Vibes', 'Brush Script MT', cursive" font-size="50" font-weight="400" fill="#111111" text-anchor="start">Jordan Lee</text>
<text id="signer_1_name" x="96" y="684" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="start">Jordan Lee</text>
<text id="signer_1_title" x="96" y="706" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B6B6B" text-anchor="start">Head of Education</text>
<text id="label_issue_date" x="440" y="610" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#8A8A8A" text-anchor="start" letter-spacing="1">Issued</text>
<text id="issue_date" x="440" y="638" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#111111" text-anchor="start">{Date}</text>
<text id="label_credential_id" x="640" y="610" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#8A8A8A" text-anchor="start" letter-spacing="1">Credential ID</text>
<text id="credential_id" x="640" y="638" font-family="'DM Sans', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600" fill="#111111" text-anchor="start">{Certificate ID}</text>
<g id="qr_code">
<rect x="927" y="606" width="100" height="100" rx="6" fill="#FAFAF7" stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="939.0" y="618.0" width="24.0" height="24.0" rx="2" fill="none" stroke="#111111" stroke-width="4.0"/>
<rect x="946.2" y="625.2" width="9.6" height="9.6" fill="#111111"/>
<rect x="991.0" y="618.0" width="24.0" height="24.0" rx="2" fill="none" stroke="#111111" stroke-width="4.0"/>
